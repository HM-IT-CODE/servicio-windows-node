[package]
name        = "node-winsvc-core"
version     = "0.1.0"
edition     = "2021"
build       = "build.rs"
description = "Native Win32 Windows Service manager - core binary for node-winsvc"

[[bin]]
name = "node-winsvc-core"
path = "src/main.rs"

# El instalador generico. Se compila una vez y no sabe nada de ninguna
# aplicacion: el CLI le pega detras un zip y un manifiesto.
[[bin]]
name = "node-winsvc-setup"
path = "src/setup_main.rs"

[build-dependencies]
winresource = "0.1"

[dependencies]
clap       = { version = "4", features = ["derive"] }
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow     = "1"
zip        = { version = "2", default-features = false, features = ["deflate", "zstd"] }
tar        = "0.4"
zstd       = "0.13"
thiserror  = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Services",
    "Win32_System_LibraryLoader",
    "Win32_Security",
    "Win32_System_EventLog",
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Controls",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_Graphics_Gdi",
] }
